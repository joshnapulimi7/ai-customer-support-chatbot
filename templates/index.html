<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Customer Support Chatbot</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 460px; background: #1e293b; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); display: flex; flex-direction: column; height: 600px; overflow: hidden; }
        .chat-header { background: #2563eb; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
        .chat-header h2 { margin: 0; font-size: 18px; }
        .session-badge { font-size: 12px; background: rgba(255,255,255,0.2); padding: 4px 8px; border-radius: 6px; }
        .chat-box { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 10px; font-size: 14px; line-height: 1.4; }
        .user-msg { align-self: flex-end; background: #2563eb; color: #fff; }
        .bot-msg { align-self: flex-start; background: #334155; color: #f1f5f9; }
        .tag { display: inline-block; font-size: 11px; font-weight: bold; background: #0ea5e9; color: #0f172a; padding: 2px 6px; border-radius: 4px; margin-bottom: 5px; }
        .escalated-tag { background: #f43f5e; color: #fff; margin-left: 5px; }
        .input-area { display: flex; padding: 12px; background: #0f172a; border-top: 1px solid #334155; gap: 8px; }
        input { flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; outline: none; }
        button { padding: 10px 16px; background: #2563eb; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>
<div class="chat-container">
    <div class="chat-header">
        <h2>AI Support Agent</h2>
        <span class="session-badge">Session: {{ session_id }}</span>
    </div>
    <div class="chat-box" id="chatBox">
        <div class="msg bot-msg">
            <span class="tag">System</span><br>
            Hello! I'm your Tier-1 AI Support Assistant. Ask me about <b>Billing</b>, <b>Technical Issues</b>, or <b>Account Settings</b> (or type <i>"escalate"</i> for a human agent).
        </div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Type your support query..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
async function sendMessage() {
    const input = document.getElementById("userInput");
    const text = input.value.trim();
    if (!text) return;

    const chatBox = document.getElementById("chatBox");
    chatBox.innerHTML += `<div class="msg user-msg">${text}</div>`;
    input.value = "";
    chatBox.scrollTop = chatBox.scrollHeight;

    const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
    });
    const data = await res.json();

    const escBadge = data.escalated ? `<span class="tag escalated-tag">Ticket Escalated</span>` : "";
    chatBox.innerHTML += `
        <div class="msg bot-msg">
            <span class="tag">${data.category}</span>${escBadge}<br>
            ${data.response}
        </div>`;
    chatBox.scrollTop = chatBox.scrollHeight;
}
</script>
</body>
</html>
